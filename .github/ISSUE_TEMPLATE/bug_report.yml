name: Bug 反馈
description: 报告本项目自身可复现的 Bug
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **警告：** 删除以下内容会导致 Issue 被直接关闭。

        <details>
        <summary>API 请求与图片下载排查</summary>

        - **网页版 API 请求被跨域策略拦截**：可以使用 Windows 客户端，或在 Docker 部署、本地开发环境中配置 API 代理。具体设置见[部署说明](https://github.com/CookSleep/gpt_image_playground/blob/main/README.md#docker-deployment)。
        - **图片下载失败**：如果 API 已返回图片链接，但图床限制跨域下载，可以使用 Windows 客户端。如果服务商支持，也可以配置接口返回 Base64 图片数据。
        - **响应格式无法识别**：可在任务详情中点击「查看原始响应」。使用非标准 API 时，请对照服务商文档核对[自定义供应商配置](https://github.com/CookSleep/gpt_image_playground/blob/main/README.md#custom-provider-config)中的结果提取路径。
        - **Codex API**：推荐使用 [CLIProxyAPI（CPA）](https://github.com/router-for-me/CLIProxyAPI)。

        </details>

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已检查该问题是否来自服务商、反代或中转项目。
          required: true
        - label: 我已搜索现有 Issue，确认没有重复反馈。
          required: true
        - label: 我已尝试使用官方兼容的 API 格式复现该问题。
          required: false
        - label: 我理解项目维护者精力有限，不能保证始终按预期效率修复问题。
          required: true

  - type: markdown
    attributes:
      value: "### 问题详情"

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请简要描述你遇到的问题。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供可稳定复现问题的操作步骤。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望项目应该如何表现？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？如有报错请粘贴完整错误信息。
    validations:
      required: true

  - type: markdown
    attributes:
      value: "### 使用环境"

  - type: dropdown
    id: version
    attributes:
      label: 部署方式
      description: 请选择你使用的部署方式。
      options:
        - Windows 客户端
        - Vercel
        - GitHub Pages
        - Cloudflare Workers
        - Docker
        - 本地部署
        - 其他
    validations:
      required: true

  - type: input
    id: deployment_detail
    attributes:
      label: 部署方式补充
      description: 如果上面选择的是「其他」，请在此填写具体的部署方式。
    validations:
      required: false

  - type: input
    id: app_version
    attributes:
      label: 版本号
      description: 可在「设置」标题右侧或 **「设置 → 关于」** 中查看。
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: 运行环境
      description: 浏览器或 Windows 客户端，以及操作系统。
    validations:
      required: true

  - type: dropdown
    id: api
    attributes:
      label: API 来源
      description: 请选择你使用的 API 来源类型。
      options:
        - OpenAI 官方 API
        - 第三方服务商提供的兼容 API
        - 反代 / 中转项目
        - 其他
    validations:
      required: true

  - type: input
    id: api_detail
    attributes:
      label: API 来源补充
      description: 如果上面选择的不是「OpenAI 官方 API」，请在此填写具体的服务商名称或反代 / 中转项目（请勿填写密钥）。
    validations:
      required: false

  - type: markdown
    attributes:
      value: "### 补充材料"

  - type: textarea
    id: logs
    attributes:
      label: 错误信息 / 截图
      description: |-
        可附上控制台报错、截图或录屏。请勿粘贴密钥。

        网页报错时，可以查看浏览器控制台和「网络」面板。Windows 客户端可在<b>「设置 → 习惯配置 → 诊断」</b>中打开日志目录，附上相关日志。
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 其他有助于定位问题的信息。
    validations:
      required: false
