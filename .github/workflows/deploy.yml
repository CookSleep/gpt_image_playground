name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    tags: ['v*']
    paths:
      - package.json
  workflow_run:
    workflows: ['Build Desktop Client']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.release.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check release version
        id: release
        env:
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ! gh api --silent "repos/$GITHUB_REPOSITORY/pages"; then
            echo "GitHub Pages is not enabled. Skipping GitHub Pages deployment."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 配置了签名私钥时，推送 tag 先构建客户端，构建成功后由 workflow_run 部署；未配置时推送 tag 直接部署
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            [[ -n "$SIGNING_KEY" ]] && deploy=true || deploy=false
            echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            [[ -z "$SIGNING_KEY" ]] && deploy=true || deploy=false
            [[ "$deploy" == false ]] && echo "Signing key is set. GitHub Pages deployment will run after the desktop client build."
            echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version=$(jq -r .version package.json)
          previous_version=$(git show "$BEFORE_SHA:package.json" 2>/dev/null | jq -r .version || true)
          if [[ -n "$previous_version" && "$version" == "$previous_version" ]]; then
            echo "Package version did not change. Skipping GitHub Pages deployment."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh api --silent "repos/CookSleep/gpt_image_playground/releases/tags/v$version"; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release v$version does not exist. Skipping GitHub Pages deployment."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: release
    if: ${{ needs.release.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          VITE_DEFAULT_API_URL: ${{ secrets.VITE_DEFAULT_API_URL }}
          VITE_LOCK_PRESET_CONFIG_PARAMS: ${{ vars.VITE_LOCK_PRESET_CONFIG_PARAMS }}
          VITE_PREVENT_PRESET_CONFIG_DELETION: ${{ vars.VITE_PREVENT_PRESET_CONFIG_DELETION }}
          VITE_SHOW_PRESET_CONFIG_ONLY: ${{ vars.VITE_SHOW_PRESET_CONFIG_ONLY }}
          VITE_SHOW_CONFIG_CHANGE_DIALOG: ${{ vars.VITE_SHOW_CONFIG_CHANGE_DIALOG }}
          VITE_DEFAULT_UI_FONT: ${{ vars.VITE_DEFAULT_UI_FONT }}
          VITE_DEFAULT_MONO_FONT: ${{ vars.VITE_DEFAULT_MONO_FONT }}
          VITE_BUILTIN_FONT_SOURCE: ${{ vars.VITE_BUILTIN_FONT_SOURCE }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
